<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-label="Mantra Taxbooks">
  <!-- Blue rounded square icon -->
  <rect x="0" y="4" width="48" height="48" rx="10" ry="10" fill="url(#iconGrad)"/>
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A56DB;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- White M letter -->
  <text x="24" y="36" font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">M</text>
  <!-- MANTRA text -->
  <text x="64" y="30" font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif" font-size="19" font-weight="800" fill="#0F172A" letter-spacing="0.5">MANTRA</text>
  <!-- TAXBOOKS text in blue -->
  <text x="64" y="47" font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#1A56DB" letter-spacing="2">TAXBOOKS</text>
</svg>
